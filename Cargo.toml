[package]
name = "lieocr"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "纯 Rust 文档 OCR：版面分析 + 文本识别 + 文档结构树，输出 Markdown，提供 CLI 与 HTTP 服务"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ocr", "paddleocr", "document-layout", "burn", "text-recognition"]
categories = ["computer-vision", "multimedia::images"]

[dependencies]
burn = { version = "0.22", features = ["flex"] }
burn-store = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
