# musl 静态构建需要显式指定链接器，否则 cargo 会用系统 cc（glibc 的 gcc）导致链接失败。
# 两个 target 都在各自架构的 runner 上原生编译，因此 linker 都是本机的 musl-gcc。

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
